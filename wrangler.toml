name = "byoc-worker"
main = "server.js"
compatibility_date = "2026-06-28"
workers_dev = true

routes = []

[[kv_namespaces]]
binding = "TEMP_KV"
id = "YOUR_KV_NAMESPACE_ID"

[cache]
enabled = true

[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

[secrets]
required = ["API_TOKEN"]

# ─── 🧪 テスト/ステージング環境 (npx wrangler deploy --env staging) ───
[env.staging]
name = "byoc-worker-staging"
workers_dev = true
routes = [] # workers.dev サブドメインのみを使用

[env.staging.secrets]
required = ["API_TOKEN"]

[[env.staging.kv_namespaces]]
binding = "TEMP_KV"
id = "YOUR_STAGING_KV_NAMESPACE_ID"

[env.staging.assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

