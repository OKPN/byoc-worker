name = "byoc-worker"
main = "server.js"
compatibility_date = "2026-06-28"
workers_dev = true

routes = [
  { pattern = "your-custom-domain.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "TEMP_KV"
id = "YOUR_KV_NAMESPACE_ID"

[vars]
CUSTOM_DOMAIN = "your-custom-domain.com"

[cache]
enabled = true

[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

[secrets]
required = ["API_TOKEN"]

# ─── 🧪 テスト/ステージング環境 (npx wrangler deploy --env staging) ───
[env.staging]
name = "byoc-worker-staging"
workers_dev = true
routes = [] # workers.dev サブドメインのみを使用

[env.staging.secrets]
required = ["API_TOKEN"]

[env.staging.vars]
CUSTOM_DOMAIN = ""

[[env.staging.kv_namespaces]]
binding = "TEMP_KV"
id = "YOUR_STAGING_KV_NAMESPACE_ID"

[env.staging.assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

