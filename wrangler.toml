name = "byoc-worker"
main = "server.js"
compatibility_date = "2026-06-28"
workers_dev = true

routes = [
  { pattern = "kv.k7m.f5.si", custom_domain = true }
]

[[kv_namespaces]]
binding = "TEMP_KV"
id = "4003c749c4cd45539759c8c0a1b3c1fa"

[cache]
enabled = true

[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

[secrets]
required = ["API_TOKEN"]

# ─── 🧪 テスト/ステージング環境 (npx wrangler deploy --env staging) ───
[env.staging]
name = "byoc-worker-staging"
workers_dev = true
routes = [] # workers.dev サブドメインのみを使用

[env.staging.secrets]
required = ["API_TOKEN"]

[[env.staging.kv_namespaces]]
binding = "TEMP_KV"
id = "ad4390d332e649d48a51208a9d6a2a4c"

[env.staging.assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

